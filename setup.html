<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BudgetFlow — Set up your plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="setup-page">

<nav class="nav nav-app">
  <div class="nav-inner">
    <a href="index.html" class="logo">💰 BudgetFlow</a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
  </div>
</nav>

<div class="setup-wrap">
  <div class="setup-header">
    <h1>Set up your budget plan</h1>
    <p>This takes 3 minutes. You can change everything later in Settings.</p>
  </div>

  <div class="card">
    <div class="form-group">
      <label>Monthly take-home (₹)</label>
      <input type="number" id="income" placeholder="55000" value="55000" min="1000" step="500">
    </div>
  </div>

  <div class="card">
    <div class="plan-header">
      <h3>Your monthly plan</h3>
      <div class="balance-badge" id="balanceBadge">—</div>
    </div>

    <table class="plan-table" id="planTable">
      <thead>
        <tr>
          <th>Line</th>
          <th>Amount (₹)</th>
          <th>Type</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="planBody"></tbody>
    </table>

    <button class="btn btn-outline btn-sm" id="addLineBtn">+ Add a line</button>
  </div>

  <div class="setup-actions">
    <button class="btn btn-primary btn-lg" id="saveSetupBtn">Save and open dashboard →</button>
    <div class="auth-msg" id="setupMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/setup.js"></script>
</body>
</html>
